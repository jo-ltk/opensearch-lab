# Fluent Bit pipeline:  INPUT -> FILTER -> OUTPUT
#
# 1. INPUT  : receive log records pushed by Docker's fluentd logging driver
# 2. FILTER : the driver wraps each line as {"log": "<raw line>", ...};
#             parse that raw line as JSON so pino fields (level, route,
#             status, msg...) become real searchable fields
# 3. OUTPUT : write to OpenSearch in daily indices: app-logs-YYYY.MM.DD

[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       pino_json
    Reserve_Data On

[OUTPUT]
    Name               opensearch
    Match              docker.*
    Host               opensearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    app-logs
    Suppress_Type_Name On
    Replace_Dots       On
    Trace_Error        On
