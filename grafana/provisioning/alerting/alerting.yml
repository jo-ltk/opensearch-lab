apiVersion: 1

# All alerts route to the Slack incoming webhook configured in SLACK_WEBHOOK_URL.
contactPoints:
  - orgId: 1
    name: slack-lab
    receivers:
      - uid: slack-lab
        type: slack
        settings:
          url: $__env{SLACK_WEBHOOK_URL}
          username: Grafana
          icon_emoji: ':rotating_light:'
          title: '{{ template "slack.default.title" . }}'
          text: '{{ template "slack.default.text" . }}'

policies:
  - orgId: 1
    receiver: slack-lab
    group_by: ['grafana_folder', 'alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: infrastructure-alerts
    folder: Infrastructure Monitoring
    interval: 30s
    rules:
      # ----------------------------------------------------------------
      # 1. High CPU: host CPU usage above 80% for 2 minutes.
      #    Trigger:  .\stress-demo.ps1
      # ----------------------------------------------------------------
      - uid: high-cpu
        title: High CPU usage
        condition: C
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: 'Host CPU usage is above 80%'
          runbook: 'Stop the stress container or wait for the load to subside'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) * 100)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [80] }

      # ----------------------------------------------------------------
      # 2. High Memory: host memory usage above 80% for 2 minutes.
      # ----------------------------------------------------------------
      - uid: high-memory
        title: High memory usage
        condition: C
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: 'Host memory usage is above 80%'
          runbook: 'Identify memory-heavy processes or restart the stress container'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) * 100
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [80] }

      # ----------------------------------------------------------------
      # 3. Low disk space: less than 20% free on a filesystem for 5 minutes.
      # ----------------------------------------------------------------
      - uid: low-disk-space
        title: Low disk space
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: 'Filesystem has less than 20% free space'
          runbook: 'Free disk space on the affected mount point'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|aufs|squashfs"} / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|aufs|squashfs"}) * 100
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: min
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [20] }
