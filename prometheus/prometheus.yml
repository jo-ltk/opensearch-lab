global:
  scrape_interval: 5s # how often Prometheus pulls /metrics from each target

scrape_configs:
  # Prometheus monitors itself — handy for learning what scraping looks like
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Our Express API (prom-client). Note: service name "api", not localhost —
  # Prometheus runs in its own container and resolves names on the compose network.
  - job_name: api
    static_configs:
      - targets: ['api:4000']

  # Container-level CPU / memory / network for every container
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
