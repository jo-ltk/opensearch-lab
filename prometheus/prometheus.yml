global:
  scrape_interval: 5s # how often Prometheus pulls /metrics from each target

scrape_configs:
  # Prometheus monitors itself — handy for learning what scraping looks like
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter exposes host-level CPU, memory, disk, and network metrics
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
